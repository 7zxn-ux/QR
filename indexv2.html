<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* Lang toggle */
    #lang-btn {
      position: fixed;
      top: 1.2rem;
      right: 1.2rem;
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0;
      text-transform: none;
      transition: border-color 0.2s;
      padding: 0;
    }
    #lang-btn:hover { border-color: #fff; }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 3.5rem;
      margin-top: 1rem;
      opacity: 0.9;
      text-align: center;
    }

    body.ar h1 {
      font-size: 1.3rem;
      letter-spacing: 0.04em;
      text-transform: none;
      line-height: 1.5;
    }

    .box {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* pill input */
    input {
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      padding: 0.9rem 1.2rem;
      outline: none;
      width: 100%;
      border-radius: 999px;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #444; }
    input:focus { border-color: #fff; }

    /* pill generate button */
    #gen-btn {
      background: #fff;
      color: #000;
      border: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    #gen-btn:hover { opacity: 0.85; }
    #gen-btn:active { opacity: 0.7; }

    /* Credit link */
    #credit {
      font-size: 0.62rem;
      color: #444;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-align: left;
      display: block;
      transition: color 0.2s;
      padding-left: 4px;
    }
    #credit:hover { color: #888; }
    body.ar #credit { text-align: right; padding-left: 0; padding-right: 4px; }

    .gen-row {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    /* QR section */
    #qr-section {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      margin-top: 2.5rem;
    }
    #qr-section.show { display: flex; }

    #qr-wrap {
      background: #fff;
      padding: 1.2rem;
      display: inline-block;
    }
    #qr-wrap canvas, #qr-wrap img { display: block; }

    /* Bottom row */
    #qr-bottom {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    /* pill download button */
    #download {
      flex: 1;
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border-radius: 999px;
      opacity: 0.6;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: opacity 0.2s, border-color 0.2s;
    }
    #download:hover { opacity: 1; border-color: #fff; }
    #download:active { opacity: 0.7; }

    /* Swatches */
    #swatches {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    .swatch[data-color="#ffffff"] { box-shadow: 0 0 0 1px #444; }
    .swatch:hover { transform: scale(1.25); }
    .swatch.active { border-color: #fff; transform: scale(1.2); }
    .swatch[data-color="#000000"].active { border-color: #666; }

    .line {
      width: 100%;
      max-width: 400px;
      height: 1px;
      background: #1a1a1a;
      margin: 2rem 0;
    }

    body.ar { direction: rtl; }
    body.ar #lang-btn { right: auto; left: 1.2rem; }

    /* ── Entrance animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scanLine {
      0%   { transform: scaleX(0); opacity: 0; }
      40%  { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    /* elements start invisible, class .do-anim triggers the animation */
    #lang-btn, h1, #url-input, #gen-btn, #credit { opacity: 0; }

    #lang-btn.do-anim  { animation: fadeDown 0.5s cubic-bezier(.22,1,.36,1) 0.1s  forwards; }
    h1.do-anim         { animation: fadeUp   0.7s cubic-bezier(.22,1,.36,1) 0.25s forwards; }
    #url-input.do-anim { animation: fadeUp   0.6s cubic-bezier(.22,1,.36,1) 0.5s  forwards; }
    #gen-btn.do-anim   { animation: fadeUp   0.6s cubic-bezier(.22,1,.36,1) 0.65s forwards; }
    #credit.do-anim    { animation: fadeUp   0.6s cubic-bezier(.22,1,.36,1) 0.78s forwards; }

    /* scan-line under the title — also class-triggered */
    h1::after {
      content: '';
      display: block;
      height: 1px;
      background: #fff;
      margin: 0.6rem auto 0;
      width: 100%;
      transform-origin: left;
      transform: scaleX(0);
      opacity: 0;
    }
    h1.do-anim::after  { animation: scanLine 0.9s cubic-bezier(.22,1,.36,1) 0.6s forwards; }
    body.ar h1::after  { transform-origin: right; }
  </style>
</head>
<body>

  <button id="lang-btn" onclick="toggleLang()" title="Switch language">ع</button>

  <h1 id="title">QR Generator</h1>

  <div class="box">
    <input type="text" id="url-input" placeholder="PUT THE LINK" />
    <div class="gen-row">
      <button id="gen-btn" onclick="generate()">Generate</button>
      <a id="credit" href="https://instagram.com/6v0_h" target="_blank" rel="noopener">MADE BY 6V0_H</a>
    </div>
  </div>

  <div class="line" id="sep" style="display:none"></div>

  <div id="qr-section">
    <div id="qr-wrap"></div>
    <div id="qr-bottom">
      <button id="download" onclick="downloadQR()">Download</button>
      <div id="swatches">
        <div class="swatch active" data-color="#ffffff" style="background:#ffffff" onclick="setBg(this)" title="White"></div>
        <div class="swatch"        data-color="#000000" style="background:#000000" onclick="setBg(this)" title="Black"></div>
        <div class="swatch"        data-color="#ef4444" style="background:#ef4444" onclick="setBg(this)" title="Red"></div>
        <div class="swatch"        data-color="#3b82f6" style="background:#3b82f6" onclick="setBg(this)" title="Blue"></div>
        <div class="swatch"        data-color="#facc15" style="background:#facc15" onclick="setBg(this)" title="Yellow"></div>
        <div class="swatch"        data-color="#22c55e" style="background:#22c55e" onclick="setBg(this)" title="Green"></div>
        <div class="swatch"        data-color="#f472b6" style="background:#f472b6" onclick="setBg(this)" title="Pink"></div>
      </div>
    </div>
  </div>

  <script>
    const strings = {
      en: { title: 'QR Generator', gen: 'Generate', dl: 'Download', placeholder: 'PUT THE LINK.', langBtn: 'ع' },
      ar: { title: 'اصنع الـQR الخاص بك بثانية.', gen: 'صنع', dl: 'تنزيل', placeholder: 'ضع الرابط هنا.', langBtn: 'E' }
    };

    let lang = 'en';
    const animEls = () => ['lang-btn','title','url-input','gen-btn','credit'].map(id => document.getElementById(id));

    function playEntranceAnim() {
      const els = animEls();
      // strip class to reset, force reflow, re-add
      els.forEach(el => { el.classList.remove('do-anim'); });
      void document.body.offsetWidth; // reflow
      els.forEach(el => el.classList.add('do-anim'));
    }

    function applyLang() {
      const s = strings[lang];
      document.getElementById('title').textContent      = s.title;
      document.getElementById('gen-btn').textContent    = s.gen;
      document.getElementById('download').textContent   = s.dl;
      document.getElementById('url-input').placeholder = s.placeholder;
      document.getElementById('lang-btn').textContent   = s.langBtn;
      document.documentElement.lang = lang;
      document.body.classList.toggle('ar', lang === 'ar');
    }

    function toggleLang() {
      lang = lang === 'en' ? 'ar' : 'en';
      applyLang();
      playEntranceAnim();
    }

    // kick off on load
    applyLang();
    playEntranceAnim();

    /* ── QR ── */
    let currentBg = '#ffffff';

    function renderQR(val) {
      const wrap = document.getElementById('qr-wrap');
      wrap.innerHTML = '';
      const darkColor = currentBg === '#000000' ? '#ffffff' : '#000000';
      new QRCode(wrap, {
        text: val,
        width: 220,
        height: 220,
        colorDark: darkColor,
        colorLight: currentBg,
        correctLevel: QRCode.CorrectLevel.H
      });
      wrap.style.background = currentBg;
    }

    function setBg(el) {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      currentBg = el.dataset.color;
      const val = document.getElementById('url-input').value.trim();
      if (val) renderQR(val);
      else document.getElementById('qr-wrap').style.background = currentBg;
    }

    function generate() {
      const val = document.getElementById('url-input').value.trim();
      if (!val) return;
      renderQR(val);
      document.getElementById('qr-section').classList.add('show');
      document.getElementById('sep').style.display = 'block';
    }

    /* ── Download — draw QR onto a fresh canvas, then save ── */
    function downloadQR() {
      const val = document.getElementById('url-input').value.trim();
      if (!val) return;

      const size = 220;
      const pad  = 20;
      const total = size + pad * 2;

      // Off-screen canvas with background + QR
      const offCanvas = document.createElement('canvas');
      offCanvas.width  = total;
      offCanvas.height = total;
      const ctx = offCanvas.getContext('2d');

      // Fill background
      ctx.fillStyle = currentBg;
      ctx.fillRect(0, 0, total, total);

      // Get the QR canvas already in the DOM
      const qrCanvas = document.querySelector('#qr-wrap canvas');
      if (qrCanvas) {
        ctx.drawImage(qrCanvas, pad, pad, size, size);
        save(offCanvas);
        return;
      }

      // Fallback: img tag (Firefox)
      const qrImg = document.querySelector('#qr-wrap img');
      if (qrImg) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { ctx.drawImage(img, pad, pad, size, size); save(offCanvas); };
        img.src = qrImg.src;
        return;
      }
    }

    function save(canvas) {
      const link = document.createElement('a');
      link.download = 'qr-code.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') generate();
    });
  </script>

</body>
</html>
